name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true

      - name: Create Flutter Android project
        run: flutter create --platforms=android --project-name web_game_studio .

      - name: Configure Android
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if 'android:extractNativeLibs="true"' not in s:
              s = s.replace(
                  "<application",
                  '<application\n        android:extractNativeLibs="true"',
                  1,
              )

          p.write_text(s)
          PY

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Prepare Python environment
        run: |
          echo "SERIOUS_PYTHON_VERSION=3.12" >> "$GITHUB_ENV"
          echo "SERIOUS_PYTHON_SITE_PACKAGES=$GITHUB_WORKSPACE/build/site-packages" >> "$GITHUB_ENV"
          echo "SERIOUS_PYTHON_APP=$GITHUB_WORKSPACE/build/python-app" >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE/build/site-packages"
          mkdir -p "$GITHUB_WORKSPACE/build/python-app"

      - name: Package Python app
        run: |
          dart run serious_python:main package python/server -p Android

      - name: Inspect Python package
        run: |
          find build -maxdepth 5 -type f | sort | head -200

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web-game-studio-apk
          path: build/app/outputs/flutter-apk/app-release.apk
